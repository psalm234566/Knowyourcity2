<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Knowyourcity</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
    
    <style>
        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; position: fixed; 
            background: #ffffff; color: #000; 
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-weight: 100; 
        }

        body { display: flex; flex-direction: column; align-items: center; padding-top: env(safe-area-inset-top, 20px); box-sizing: border-box; }
        #title { margin: 20px 0; font-size: 28px; letter-spacing: 2px; text-transform: lowercase; }
        
        #viewer-container, #map-container { 
            width: 92vw; height: 52vh; max-width: 500px; 
            border-radius: 30px; overflow: hidden; position: relative; 
            border: 1px solid #eeeeee; background: #f9f9f9; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            display: none; 
        }

        #swipe-card { width: 100%; height: 100%; position: relative; transition: transform 0.3s ease, opacity 0.3s ease; touch-action: none; }
        #static-img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
        
        /* Swipe Overlay Farben */
        #swipe-card::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
        #swipe-card.swipe-left::after { background: rgba(255, 75, 43, 0.3); opacity: 1; }
        #swipe-card.swipe-right::after { background: rgba(69, 182, 73, 0.3); opacity: 1; }

        #map { width: 100%; height: 100%; }
        #start-screen, #level-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 60vh; width: 100%; }
        #level-screen { display: none; }
        .city-btn, .level-btn { width: 80%; max-width: 260px; padding: 15px; margin: 10px; font-size: 18px; border-radius: 40px; border: 1px solid #000; cursor: pointer; background: transparent; text-transform: lowercase; }
        .buttons { display: none; gap: 40px; margin-top: 25px; }
        .action-btn { width: 75px; height: 75px; border: 1px solid #eeeeee; border-radius: 50%; font-size: 24px; background: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .ui-container { display: flex; flex-direction: column; align-items: center; width: 100%; margin-top: auto; margin-bottom: 30px; }
        .btn-ui { padding: 12px 20px; font-size: 14px; border-radius: 12px; margin: 5px; border: 1px solid #000; background: transparent; display: none; cursor: pointer; width: 70%; max-width: 220px; text-transform: lowercase; }
        
        .leaflet-popup-content-wrapper { border-radius: 20px; padding: 0; overflow: hidden; }
        .leaflet-popup-content { margin: 0; width: 250px !important; }
        .popup-img { width: 100%; height: 170px; object-fit: cover; display: block; }
        .popup-nav { padding: 10px; display: flex; flex-direction: column; gap: 5px; }
    </style>
</head>
<body>

    <h2 id="title">knowyourcity</h2>

    <div id="start-screen">
        <button class="city-btn" onclick="selectCity('stuttgart')">stuttgart</button>
        <button class="city-btn" onclick="showOffenbachLevels()">offenbach</button>
        <button class="city-btn" onclick="selectCity('mainz')">mainz</button>
        <button class="city-btn" onclick="selectCity('weimar')">weimar</button>
    </div>

    <div id="level-screen">
        <button class="level-btn" onclick="selectOffenbachLevel(1)">zentrum</button>
        <button class="level-btn" onclick="selectOffenbachLevel(2)">stadtgebiet</button>
        <button class="level-btn" onclick="selectOffenbachLevel(3)">full city</button>
        <button onclick="location.reload()" style="background:none; border:none; color:#999; margin-top:20px;">← zurück</button>
    </div>

    <div id="viewer-container">
        <div id="swipe-card">
            <img id="static-img" src="" alt="lade...">
        </div>
    </div>
    
    <div id="map-container"><div id="map"></div></div>

    <div class="buttons" id="action-buttons">
        <button class="action-btn" style="color:#ff4b2b" onclick="handleDecision('left')">✕</button>
        <button class="action-btn" style="color:#45b649" onclick="handleDecision('right')">♥</button>
    </div>

    <div class="ui-container">
        <button id="end-btn" class="btn-ui" onclick="finishExploration()">karte anzeigen</button>
        <button id="back-btn" class="btn-ui" onclick="backToSwipe()">weiter spielen</button>
        <button id="home-btn" class="btn-ui" onclick="location.href=location.pathname">stadt wechseln</button>
    </div>

    <script>
        const ACCESS_TOKEN = 'MLY|25939357002342896|dcc9f85428352280ece926aa4f600e3d';
        const CITIES = {
            stuttgart: { minLng: 9.135, maxLng: 9.215, minLat: 48.755, maxLat: 48.810, center: [48.783, 9.18], zoom: 12 },
            weimar: { minLng: 11.305, maxLng: 11.355, minLat: 50.965, maxLat: 51.002, center: [50.983, 11.328], zoom: 13 },
            offenbach: { center: [50.105, 8.76], zoom: 13 },
            mainz: { minLng: 8.245, maxLng: 8.285, minLat: 49.990, maxLat: 50.015, center: [50.000, 8.265], zoom: 13 }
        };

        let currentCity, map, ratings = [], currentImg = null;
        let card, hammer;

        function initSwipe() {
            card = document.getElementById('swipe-card');
            hammer = new Hammer(card);
            hammer.on('pan', (e) => {
                card.style.transition = 'none';
                card.style.transform = `translateX(${e.deltaX}px) rotate(${e.deltaX / 20}deg)`;
                if (e.deltaX > 50) card.className = 'swipe-right';
                else if (e.deltaX < -50) card.className = 'swipe-left';
                else card.className = '';
            });

            hammer.on('panend', (e) => {
                if (e.deltaX > 150) handleDecision('right');
                else if (e.deltaX < -150) handleDecision('left');
                else {
                    card.style.transition = 'transform 0.3s ease';
                    card.style.transform = '';
                    card.className = '';
                }
            });
        }

        function showOffenbachLevels() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('level-screen').style.display = 'flex';
        }

        function selectOffenbachLevel(lvl) {
            currentCity = Object.assign({}, CITIES.offenbach);
            if (lvl === 1) { currentCity.minLng = 8.758; currentCity.maxLng = 8.768; currentCity.minLat = 50.102; currentCity.maxLat = 50.108; }
            else if (lvl === 2) { currentCity.minLng = 8.745; currentCity.maxLng = 8.780; currentCity.minLat = 50.095; currentCity.maxLat = 50.112; }
            else { currentCity.minLng = 8.730; currentCity.maxLng = 8.785; currentCity.minLat = 50.085; currentCity.maxLat = 50.115; }
            startEngine();
        }

        function selectCity(key) { currentCity = CITIES[key]; startEngine(); }

        function startEngine() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('level-screen').style.display = 'none';
            document.getElementById('viewer-container').style.display = 'block';
            document.getElementById('action-buttons').style.display = 'flex';
            document.getElementById('end-btn').style.display = 'inline-block';
            ratings = JSON.parse(localStorage.getItem('knowyourcity_all_ratings')) || [];
            initSwipe();
            fetchNewImage();
        }

        async function fetchNewImage() {
            const randLng = Math.random() * (currentCity.maxLng - currentCity.minLng) + currentCity.minLng;
            const randLat = Math.random() * (currentCity.maxLat - currentCity.minLat) + currentCity.minLat;
            const url = `https://graph.mapillary.com/images?access_token=${ACCESS_TOKEN}&fields=id,geometry,thumb_2048_url&bbox=${randLng-0.005},${randLat-0.005},${randLng+0.005},${randLat+0.005}&limit=1`;
            
            try {
                const res = await fetch(url);
                const data = await res.json();
                if (data.data && data.data.length > 0) {
                    const img = data.data[0];
                    currentImg = { id: img.id, coords: img.geometry.coordinates };
                    document.getElementById('static-img').src = img.thumb_2048_url;
                    card.style.transition = 'none';
                    card.style.transform = '';
                    card.style.opacity = '1';
                    card.className = '';
                } else { fetchNewImage(); }
            } catch (e) { setTimeout(fetchNewImage, 1000); }
        }

        function handleDecision(dir) {
            if (!currentImg) return;
            ratings.push({ id: currentImg.id, lng: currentImg.coords[0], lat: currentImg.coords[1], color: dir === 'right' ? '#45b649' : '#ff4b2b' });
            localStorage.setItem('knowyourcity_all_ratings', JSON.stringify(ratings));
            
            card.style.transition = 'transform 0.4s ease, opacity 0.4s ease';
            card.style.transform = `translateX(${dir === 'right' ? 500 : -500}px) rotate(${dir === 'right' ? 30 : -30}deg)`;
            card.style.opacity = '0';
            
            setTimeout(fetchNewImage, 300);
        }

        function finishExploration() {
            document.getElementById('viewer-container').style.display = 'none';
            document.getElementById('action-buttons').style.display = 'none';
            document.getElementById('end-btn').style.display = 'none';
            document.getElementById('map-container').style.display = 'block';
            document.getElementById('back-btn').style.display = 'inline-block';
            document.getElementById('home-btn').style.display = 'inline-block';

            if (!map) {
                map = L.map('map', { zoomControl: false });
                L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);
            }
            setTimeout(() => { map.invalidateSize(); renderMarkers(); }, 200);
        }

        async function renderMarkers() {
            map.eachLayer(l => { if (l instanceof L.CircleMarker) map.removeLayer(l); });
            const coords = [];
            for (let p of ratings) {
                const marker = L.circleMarker([p.lat, p.lng], { radius: 10, fillColor: p.color, color: "#fff", weight: 2, fillOpacity: 0.9 }).addTo(map);
                const popupImgUrl = `https://graph.mapillary.com/${p.id}?access_token=${ACCESS_TOKEN}&fields=thumb_640_url`;
                marker.on('click', async () => {
                    const res = await fetch(popupImgUrl);
                    const data = await res.json();
                    marker.bindPopup(`<img src="${data.thumb_640_url}" class="popup-img">`).openPopup();
                });
                coords.push([p.lat, p.lng]);
            }
            if (coords.length > 0) map.fitBounds(coords, { padding: [50, 50] });
        }

        function backToSwipe() {
            document.getElementById('map-container').style.display = 'none';
            document.getElementById('viewer-container').style.display = 'block';
            document.getElementById('action-buttons').style.display = 'flex';
            document.getElementById('end-btn').style.display = 'inline-block';
            document.getElementById('back-btn').style.display = 'none';
            document.getElementById('home-btn').style.display = 'none';
        }
    </script>
</body>
</html>
