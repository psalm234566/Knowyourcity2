<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowyourcity - 1920x1080</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
    
    <style>
        /* --- GRUNDLAYOUT --- */
        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; 
            font-family: sans-serif;
        }

        /* --- STARTBILDSCHIRM (DAS 1:1 BILD) --- */
        #start-screen {
            width: 100vw;
            height: 100vh;
            /* HIER DEIN BILD EINFÜGEN: */
            background-image: url('startseite.jpg'); 
            background-size: cover;       /* Bild füllt den Screen */
            background-position: center;  /* Zentriert */
            background-repeat: no-repeat;
            position: relative;
        }

        /* --- UNSICHTBARES GRID FÜR DIE BUTTONS --- */
        /* Das Grid liegt genau da, wo deine Städte im Bild stehen */
        .click-layer {
            position: absolute;
            top: 20%;      /* Abstand von oben anpassen, falls nötig */
            left: 10%;     /* Abstand von links anpassen */
            width: 80%;    /* Breite des Button-Bereichs */
            height: 60%;   /* Höhe des Button-Bereichs */
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* 4 Spalten: Hamburg, Köln, Hannover, Berlin */
            grid-template-rows: repeat(3, 1fr);    /* 3 Zeilen */
            gap: 20px;     /* Abstand zwischen den unsichtbaren Buttons */
        }

        [cite_start]/* Der Zurück-Link oben links [cite: 1] */
        #tutorial-btn {
            position: absolute;
            top: 5%;       /* Anpassen an dein Bild */
            left: 5%;      /* Anpassen an dein Bild */
            width: 300px;
            height: 50px;
            cursor: pointer;
            /* background: rgba(255,0,0,0.3); */ /* Zum Testen einkommentieren */
        }

        .city-trigger {
            background: transparent; /* Unsichtbar */
            border: none;
            cursor: pointer;
            /* border: 1px solid red; */ /* <--- LÖSCHEN WENN FERTIG: Zeigt Rahmen zum Ausrichten */
        }

        .city-trigger:hover {
            background: rgba(255, 255, 255, 0.1); /* Leichter Hover-Effekt (optional) */
        }

        /* --- SPIEL INTERFACE (Bleibt gleich) --- */
        #game-interface {
            display: none; /* Versteckt am Anfang */
            width: 100%; height: 100%;
            background: #f4f4f4;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #viewer-container { 
            width: 450px; height: 650px; 
            border-radius: 20px; position: relative; perspective: 1000px;
            background: white; box-shadow: 0 20px 50px rgba(0,0,0,0.1);
        }
        
        .card { 
            width: 100%; height: 100%; position: absolute; top: 0; left: 0;
            border-radius: 20px; overflow: hidden; background: #fff; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        #back-card { z-index: 1; transform: scale(0.95); opacity: 0.8; }
        #top-card { z-index: 2; cursor: grab; }
        
        .card img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
        #top-card::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
        #top-card.swipe-left::after { background: rgba(255, 75, 43, 0.4); opacity: 1; }
        #top-card.swipe-right::after { background: rgba(69, 182, 73, 0.4); opacity: 1; }

        .buttons { display: flex; gap: 40px; margin-top: 30px; }
        .action-btn { width: 80px; height: 80px; border-radius: 50%; border: none; font-size: 32px; background: white; cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        
        #map-container { display: none; width: 80%; height: 80%; border-radius: 20px; overflow: hidden; }
        #map { width: 100%; height: 100%; }

        .ui-nav { position: absolute; bottom: 30px; right: 30px; display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }
        .btn-ui { padding: 10px 20px; border: 1px solid #000; background: white; cursor: pointer; text-transform: uppercase; font-weight: bold; }
        
        /* Offenbach Menu (Minimalistisch überlagert) */
        #level-screen {
            display: none;
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.95);
            flex-direction: column; align-items: center; justify-content: center; z-index: 100;
        }
        .level-item { font-size: 32px; margin: 15px; background: none; border: none; cursor: pointer; text-transform: uppercase; font-weight: 900; }
        
        /* Popup Styles */
        .leaflet-popup-content-wrapper { padding: 0; overflow: hidden; }
        .popup-img { width: 250px; height: 150px; object-fit: cover; }
        .popup-controls { display: flex; height: 40px; }
        .popup-vote-btn { flex: 1; border: none; background: white; cursor: pointer; font-size: 18px; }
    </style>
</head>
<body>

    <div id="start-screen">
        
        <div id="tutorial-btn" onclick="alert('Zurück zum Tutorial')"></div>

        <div class="click-layer">
            <button class="city-trigger" onclick="selectCity('hamburg')" title="Hamburg"></button>
            <button class="city-trigger" onclick="selectCity('koeln')" title="Köln"></button>
            <button class="city-trigger" onclick="selectCity('hannover')" title="Hannover"></button>
            <button class="city-trigger" onclick="selectCity('berlin')" title="Berlin"></button>
            
            <button class="city-trigger" onclick="selectCity('frankfurt')" title="Frankfurt"></button>
            <button class="city-trigger" onclick="showOffenbachLevels()" title="Offenbach"></button>
            <button class="city-trigger" onclick="selectCity('karlsruhe')" title="Karlsruhe"></button>
            <button class="city-trigger" onclick="selectCity('stuttgart')" title="Stuttgart"></button>
            
            <button class="city-trigger" onclick="selectCity('leipzig')" title="Leipzig"></button>
            <button class="city-trigger" onclick="selectCity('dresden')" title="Dresden"></button>
            <button class="city-trigger" onclick="selectCity('nuernberg')" title="Nürnberg"></button>
            <button class="city-trigger" onclick="selectCity('muenchen')" title="München"></button>
        </div>
    </div>

    <div id="level-screen">
        <h2 style="font-size:40px; text-transform: uppercase;">OFFENBACH AREA</h2>
        <button class="level-item" onclick="selectOffenbachLevel(1)">ZENTRUM</button>
        <button class="level-item" onclick="selectOffenbachLevel(2)">STADTGEBIET</button>
        <button class="level-item" onclick="selectOffenbachLevel(3)">FULL CITY</button>
        <button class="level-item" onclick="location.reload()" style="color:#999; margin-top:50px;">ZURÜCK</button>
    </div>

    <div id="game-interface">
        <div id="viewer-container">
            <div id="back-card" class="card"><img id="back-img" src="" alt=""></div>
            <div id="top-card" class="card"><img id="top-img" src="" alt=""></div>
        </div>
        <div id="map-container"><div id="map"></div></div>
        <div class="buttons" id="action-buttons">
            <button class="action-btn" style="color:#ff4b2b" onclick="handleDecision('left')">✕</button>
            <button class="action-btn" style="color:#45b649" onclick="handleDecision('right')">♥</button>
        </div>
        <div class="ui-nav">
            <button class="btn-ui" id="btn-show-map" onclick="finishExploration()">KARTE ANZEIGEN</button>
            <button class="btn-ui" id="btn-resume" onclick="backToSwipe()" style="display:none;">WEITER SPIELEN</button>
            <button class="btn-ui" onclick="location.reload()">HAUPTMENÜ</button>
        </div>
    </div>

    <script>
        const ACCESS_TOKEN = 'MLY|25939357002342896|dcc9f85428352280ece926aa4f600e3d';

        [cite_start]// Liste aller Städte aus PDF [cite: 2-12]
        const CITIES = {
            hamburg:   { minLng: 9.90, maxLng: 10.10, minLat: 53.50, maxLat: 53.60, center: [53.55, 10.00] },
            koeln:     { minLng: 6.90, maxLng: 7.05, minLat: 50.90, maxLat: 51.00, center: [50.93, 6.96] },
            hannover:  { minLng: 9.65, maxLng: 9.85, minLat: 52.32, maxLat: 52.42, center: [52.37, 9.73] },
            berlin:    { minLng: 13.25, maxLng: 13.55, minLat: 52.45, maxLat: 52.58, center: [52.52, 13.40] },
            frankfurt: { minLng: 8.60, maxLng: 8.75, minLat: 50.07, maxLat: 50.15, center: [50.11, 8.68] },
            offenbach: { center: [50.105, 8.76] }, 
            karlsruhe: { minLng: 8.35, maxLng: 8.50, minLat: 48.98, maxLat: 49.05, center: [49.00, 8.40] },
            stuttgart: { minLng: 9.135, maxLng: 9.215, minLat: 48.755, maxLat: 48.810, center: [48.783, 9.18] },
            leipzig:   { minLng: 12.30, maxLng: 12.45, minLat: 51.28, maxLat: 51.38, center: [51.33, 12.37] },
            dresden:   { minLng: 13.65, maxLng: 13.85, minLat: 51.00, maxLat: 51.10, center: [51.05, 13.73] },
            nuernberg: { minLng: 11.00, maxLng: 11.15, minLat: 49.40, maxLat: 49.50, center: [49.45, 11.07] },
            muenchen:  { minLng: 11.45, maxLng: 11.70, minLat: 48.10, maxLat: 48.20, center: [48.13, 11.58] }
        };

        let currentCity, map, ratings = [];
        let topCardData = null, backCardData = null;
        let hammer, isAnimating = false;

        document.addEventListener('keydown', (e) => {
            if(document.getElementById('game-interface').style.display === 'flex' && !isAnimating) {
                if(e.key === 'ArrowRight') handleDecision('right');
                if(e.key === 'ArrowLeft') handleDecision('left');
            }
        });

        function selectCity(key) {
            currentCity = CITIES[key];
            startGame();
        }

        function showOffenbachLevels() {
            // Zeigt das Sub-Menü über dem Hintergrundbild
            document.getElementById('level-screen').style.display = 'flex';
        }

        function selectOffenbachLevel(lvl) {
            currentCity = Object.assign({}, CITIES.offenbach);
            if(lvl === 1) { currentCity.minLng = 8.758; currentCity.maxLng = 8.768; currentCity.minLat = 50.102; currentCity.maxLat = 50.108; }
            else if(lvl === 2) { currentCity.minLng = 8.745; currentCity.maxLng = 8.780; currentCity.minLat = 50.095; currentCity.maxLat = 50.112; }
            else { currentCity.minLng = 8.730; currentCity.maxLng = 8.785; currentCity.minLat = 50.085; currentCity.maxLat = 50.115; }
            startGame();
        }

        async function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('level-screen').style.display = 'none';
            document.getElementById('game-interface').style.display = 'flex';
            document.getElementById('viewer-container').style.display = 'block';
            document.getElementById('action-buttons').style.display = 'flex';
            
            topCardData = await getMapillaryImage();
            document.getElementById('top-img').src = topCardData.localUrl;
            initSwipe();
            backCardData = await getMapillaryImage();
            document.getElementById('back-img').src = backCardData.localUrl;
        }

        async function getMapillaryImage() {
            const randLng = Math.random() * (currentCity.maxLng - currentCity.minLng) + currentCity.minLng;
            const randLat = Math.random() * (currentCity.maxLat - currentCity.minLat) + currentCity.minLat;
            const url = `https://graph.mapillary.com/images?access_token=${ACCESS_TOKEN}&fields=id,geometry,thumb_1024_url&bbox=${randLng-0.005},${randLat-0.005},${randLng+0.005},${randLat+0.005}&limit=1`;
            try {
                const res = await fetch(url);
                const data = await res.json();
                if (data.data && data.data.length > 0) {
                    const imgInfo = data.data[0];
                    const blob = await (await fetch(imgInfo.thumb_1024_url)).blob();
                    return { id: imgInfo.id, coords: imgInfo.geometry.coordinates, localUrl: URL.createObjectURL(blob) };
                }
            } catch (e) {}
            return getMapillaryImage();
        }

        function initSwipe() {
            const el = document.getElementById('top-card');
            if (hammer) hammer.destroy();
            hammer = new Hammer(el);
            hammer.on('pan', (e) => {
                if (isAnimating) return;
                el.style.transition = 'none';
                el.style.transform = `translateX(${e.deltaX}px) rotate(${e.deltaX/20}deg)`;
                if (e.deltaX > 50) el.className = 'card swipe-right';
                else if (e.deltaX < -50) el.className = 'card swipe-left';
            });
            hammer.on('panend', (e) => {
                if (isAnimating) return;
                if (e.deltaX > 100) handleDecision('right');
                else if (e.deltaX < -100) handleDecision('left');
                else { el.style.transition = '0.3s'; el.style.transform = ''; el.className = 'card'; }
            });
        }

        async function handleDecision(dir) {
            if (!topCardData || isAnimating) return;
            isAnimating = true;
            ratings.push({ id: Date.now(), lat: topCardData.coords[1], lng: topCardData.coords[0], color: dir === 'right' ? '#45b649' : '#ff4b2b', imgUrl: topCardData.localUrl });
            
            const el = document.getElementById('top-card');
            el.className = dir === 'right' ? 'card swipe-right' : 'card swipe-left';
            el.style.transition = '0.4s ease';
            el.style.transform = `translateX(${dir === 'right' ? 800 : -800}px) rotate(${dir === 'right' ? 45 : -45}deg)`;
            el.style.opacity = '0';
            
            setTimeout(async () => {
                topCardData = backCardData;
                document.getElementById('top-img').src = topCardData.localUrl;
                el.style.transition = 'none'; el.style.transform = ''; el.style.opacity = '1'; el.className = 'card';
                isAnimating = false;
                backCardData = await getMapillaryImage();
                document.getElementById('back-img').src = backCardData.localUrl;
            }, 400);
        }

        function finishExploration() {
            document.getElementById('viewer-container').style.display = 'none';
            document.getElementById('action-buttons').style.display = 'none';
            document.getElementById('map-container').style.display = 'block';
            document.getElementById('btn-show-map').style.display = 'none';
            document.getElementById('btn-resume').style.display = 'inline-block';
            if (!map) {
                map = L.map('map').setView(currentCity.center || [51.16, 10.45], 13);
                L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(map);
            }
            setTimeout(() => { map.invalidateSize(); renderMarkers(); }, 200);
        }

        function backToSwipe() {
            document.getElementById('map-container').style.display = 'none';
            document.getElementById('viewer-container').style.display = 'block';
            document.getElementById('action-buttons').style.display = 'flex';
            document.getElementById('btn-show-map').style.display = 'inline-block';
            document.getElementById('btn-resume').style.display = 'none';
        }

        function renderMarkers() {
            map.eachLayer(l => { if(l instanceof L.CircleMarker) map.removeLayer(l); });
            const group = [];
            ratings.forEach(r => {
                const m = L.circleMarker([r.lat, r.lng], { color: '#fff', fillColor: r.color, fillOpacity: 1, radius: 10, weight: 2 }).addTo(map);
                m.bindPopup(`<img src="${r.imgUrl}" class="popup-img"><div class="popup-controls"><button class="popup-vote-btn" onclick="updateRating(${r.id},'#ff4b2b')">✕</button><button class="popup-vote-btn" onclick="updateRating(${r.id},'#45b649')">♥</button></div>`);
                group.push([r.lat, r.lng]);
            });
            if(group.length) map.fitBounds(group, { padding: [50,50] });
        }
        
        window.updateRating = function(id, col) {
             const r = ratings.find(x => x.id === id);
             if(r) { r.color = col; renderMarkers(); map.closePopup(); }
        }
    </script>
</body>
</html>
